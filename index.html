
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTogo - Recherche éducative</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f7ff;
      color: #17324d;
    }
    header {
      background: #087f5b;
      color: white;
      padding: 22px;
      border-radius: 12px;
      text-align: center;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select {
      border: 1px solid #bbb;
      background: white;
    }
    button {
      background: #087f5b;
      color: white;
      border: 0;
      font-weight: bold;
    }
    .carte {
      background: white;
      padding: 16px;
      margin-top: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>EduTogo</h1>
    <p>Recherche éducative au Togo</p>
  </header>

  <div class="carte">
    <h2>Que veux-tu apprendre ?</h2>
    <input id="recherche" placeholder="Ex. mathématiques, français...">
    <select id="type">
      <option value="cours">Cours</option>
      <option value="exercices">Exercices</option>
   <option value="actualites">Actualités</option>
    </select>
    <button onclick="chercher()">Rechercher</button>
    <div id="resultats"></div>
  </div>

  <script>
    
const ressources = [
  {matiere:"Mathématiques", type:"cours", titre:"Cours de mathématiques", url:"#"},
  {matiere:"Mathématiques", type:"exercices", titre:"Exercices de mathématiques", url:"#"},
  {matiere:"Français", type:"cours", titre:"Cours de français", url:"#"},
  {matiere:"Français", type:"exercices", titre:"Exercices de français", url:"#"},
  {matiere:"Anglais", type:"cours", titre:"Cours d'anglais", url:"#"},
  {matiere:"Anglais", type:"exercices", titre:"Exercices d'anglais", url:"#"},
  {matiere:"Philosophie", type:"cours", titre:"Cours de philosophie", url:"#"},
  {matiere:"Philosophie", type:"exercices", titre:"Exercices de philosophie", url:"#"},
  {matiere:"Histoire", type:"cours", titre:"Cours d'histoire", url:"#"},
  {matiere:"Géographie", type:"cours", titre:"Cours de géographie", url:"#"},
  {matiere:"Actualités", type:"actualites", titre:"Actualités de l'éducation au Togo", url:"https://education.gouv.tg/"},
  {matiere:"Actualités", type:"actualites", titre:"Actualités générales du Togo", url:"https://www.republicoftogo.com/"}
];
    
function chercher() {
  const mot = document.getElementById("recherche").value.toLowerCase().trim();
  const type = document.getElementById("type").value;
  const zone = document.getElementById("resultats");

  const resultat = ressources.filter(r =>
    (r.matiere.toLowerCase().includes(mot) ||
     r.titre.toLowerCase().includes(mot)) &&
    r.type === type
  );

  if (!resultat.length) {
    zone.innerHTML = "<p>Aucun résultat trouvé. Essaie une autre recherche.</p>";
    return;
  }

  zone.innerHTML = resultat.map(r =>
    `<p><a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.titre}</a></p>`
  ).join("");
}
    
  
  </script>
<div id="resultatsEduTogo"></div>
</body>
</html>
